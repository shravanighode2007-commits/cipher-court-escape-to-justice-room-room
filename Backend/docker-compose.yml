version: '3.8'

services:
  # Option A: Standalone SQLite Backend Service (Default - zero setup)
  backend-sqlite:
    build:
      context: .
      dockerfile: Dockerfile
    command: python server.py
    container_name: cipher_court_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./cipher_court.db:/app/cipher_court.db
    environment:
      - PORT=8000
      - HOST=0.0.0.0

